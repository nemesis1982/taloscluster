---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coturn
  namespace: doorbell-coturn
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 18.16.13
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m
  values:
    image:
      repository: coturn/coturn
      tag: "4.6.2"
      pullPolicy: IfNotPresent

    securityContext:
      container:
        readOnlyRootFilesystem: false
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0

    # With hostNetwork the Service is cosmetic -- it is what the probes target.
    service:
      main:
        ports:
          main:
            port: 3478
            targetPort: 3478
            protocol: tcp

    configmap:
      turnserver:
        enabled: true
        data:
          turnserver.conf: |
            listening-port=3478
            fingerprint
            use-auth-secret
            realm=doorbell.${DOMAIN_0}
            min-port=49160
            max-port=49200
            no-tls
            no-dtls
            no-multicast-peers
            stale-nonce=600

    persistence:
      turnserver:
        enabled: true
        type: configmap
        objectName: turnserver          # -> ConfigMap coturn-app-template-turnserver
        mountPath: /etc/coturn/turnserver.conf
        subPath: turnserver.conf
        readOnly: true

    workload:
      main:
        replicas: 1
        podSpec:
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            kubernetes.io/arch: amd64            # keep: this replaces the chart default
            kubernetes.io/hostname: ${DOORBELL_TURN_NODE}
          containers:
            main:
              args:
                - -c
                - /etc/coturn/turnserver.conf
                - --static-auth-secret=$(TURN_SECRET)
                - --external-ip=${DOORBELL_TURN_IP}
              env:
                TURN_SECRET:
                  secretKeyRef:
                    expandObjectName: false
                    name: doorbell-turn
                    key: Ice__TurnSecret
              probes:
                liveness:
                  type: tcp
                readiness:
                  type: tcp
                startup:
                  type: tcp
