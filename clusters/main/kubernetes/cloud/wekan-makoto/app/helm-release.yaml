apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wekan-makoto
  namespace: wekan-makoto
spec:
  interval: 5m
  chart:
    spec:
      chart: wekan
      version: 21.6.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m
  values:
    global:
      stopAll: false

    # Chart 21.6.0 ships wekan v9.18, whose LDAP support cannot express this
    # setup: it has no LDAP_GROUP_BASEDN (group searches run against
    # LDAP_BASEDN) and LDAP_GROUP_FILTER_GROUP_NAME matches a single group only.
    # v11.02 adds both, so the LDAP block below is the plain configuration
    # instead of a set of workarounds.
    image:
      repository: docker.io/wekanteam/wekan
      tag: v11.02@sha256:6934aa82c4111370ed20d3ca82861fb6117d9b19ba8230bce825f5b7cb772e3d

    credentials:
      minio:
        type: s3
        url: "${S3_URL}"
        bucket: "taloscluster"
        accessKey: "${S3_ACCESKEY}"
        secretKey: "${S3_SECRETKEY}"
        encrKey: "${S3_ENC}"

    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: makoto-wekan.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      data:
        volsync:
        - name: data
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 10 1 * * *
    mongodb:
      enabled: true
      mongodbUsername: wekan
      mongodbDatabase: wekan

      persistence:
        # Holds only the mongodump archive, mounted into the CronJob below.
        # This is the volume that gets shipped offsite; the live mongodb data
        # volume is deliberately NOT backed up directly.
        dump:
          enabled: true
          size: 20Gi
          targetSelector:
            dump:
              dump:
                mountPath: /dump
          volsync:
            - name: dump
              type: restic
              credentials: minio
              dest:
                enabled: true
              src:
                enabled: true
                # 01:30, after the 01:00 mongodump has completed.
                trigger:
                  schedule: 30 1 * * *
      # Wekan (Meteor 3) requires MongoDB change streams, which only work on a
      # replica set. Run the bundled bitnami mongodb as a single-node replica set.
      workload:
        main:
          podSpec:
            initContainers:
              # ROOT CAUSE of the "no primary after every restart" loop: mongod
              # checks whether the replica-set member host is itself within
              # milliseconds of starting. At that moment the pod's address is
              # usually not in the service EndpointSlice yet, so
              # wekan-makoto-mongodb resolves to nothing, mongod concludes it is
              # not a member of its own set, marks itself REMOVED - and never
              # re-checks. The stored config is fine, which is why applying the
              # very same config by hand later fixes it.
              # Block mongod until its own DNS name resolves, so the check that
              # runs once runs against a warm record.
              dnswait:
                enabled: true
                type: init
                imageSelector: wgetImage
                command:
                  - /bin/sh
                  - -c
                  - |
                    # getent, not nslookup: the wgetImage is plain ubuntu and
                    # has no dnsutils, but getent is part of glibc.
                    for i in $(seq 1 60); do
                      if getent hosts wekan-makoto-mongodb; then
                        echo "dns: wekan-makoto-mongodb resolves, starting mongod"
                        exit 0
                      fi
                      sleep 1
                    done
                    echo "dns: still unresolved after 60s, starting anyway"
                    exit 0
            containers:
              main:
                env:
                  MONGODB_REPLICA_SET_MODE: primary
                  MONGODB_REPLICA_SET_NAME: rs0
                  # Must match the mongodb service name: <release>-mongodb
                  MONGODB_ADVERTISED_HOSTNAME: wekan-makoto-mongodb
                  # Internal keyfile auth for the replica set (required by the
                  # bitnami image when auth + replica set mode are enabled).
                  # Consider moving this into the SOPS clusterenv as a ${VAR}.
                  MONGODB_REPLICA_SET_KEY: d950d2b3ca562d2290cc327a3f01a6c8
                  # Keep mongod's cache small: every probe tick spawns a mongosh
                  # (Node.js, ~200MB) and with the default cache size the
                  # container OOM-kills probes/execs, causing restart loops.
                  MONGODB_EXTRA_FLAGS: "--wiredTigerCacheSizeGB=0.5"
                # The bitnami image only auto-initiates the replica set on an
                # EMPTY data dir; on a restart with persisted data mongod comes
                # up with an uninitiated (or stuck memberless) replica set and
                # wekan cannot connect. This hook makes the replica set
                # self-healing on every container start:
                #  - NotYetInitialized        -> rs.initiate
                #  - initiated but no primary
                #    after ~60s (e.g. node marked REMOVED because the service
                #    had no endpoints during boot) -> force reconfig
                lifecycle:
                  postStart:
                    type: exec
                    command:
                      - /bin/bash
                      - -c
                      - |
                        # stderr is kept (redirected onto stdout) so a failing
                        # repair shows up in `kubectl logs`, instead of the
                        # replica set staying broken with no explanation.
                        m() { mongosh -u root -p "$MONGODB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "$1" 2>&1; }
                        notprimary=0
                        for i in $(seq 1 90); do
                          state=$(m 'try { print(rs.status().myState) } catch(e) { print(e.codeName) }' | tail -1)
                          case "$state" in
                            1) echo "replset: PRIMARY"; exit 0 ;;
                            NotYetInitialized)
                              echo "replset: initiating"
                              m 'rs.initiate({_id:"rs0",members:[{_id:0,host:"wekan-makoto-mongodb:27017"}]})' ;;
                            *[0-9]*|InvalidReplicaSetConfig)
                              # mongod is answering but is not primary - almost
                              # always REMOVED from the self-check race above.
                              # Re-assert the (already correct) member host to
                              # make mongod re-evaluate; this is exactly the
                              # manual reconfig that fixes it.
                              notprimary=$((notprimary + 1))
                              if [ "$notprimary" -ge 3 ]; then
                                echo "replset: state=$state, forcing reconfig"
                                m 'c = db.getSiblingDB("local").system.replset.findOne();
                                   c.members = [{_id:0, host:"wekan-makoto-mongodb:27017"}];
                                   c.version = c.version + 1;
                                   rs.reconfig(c, {force:true});'
                                notprimary=0
                              fi ;;
                          esac
                          sleep 2
                        done
                        echo "replset: giving up after 3 minutes"
                        exit 0
      # A replica set member must advertise an address that resolves to the POD
      # itself: mongod compares the member host against its own local addresses
      # to recognise itself. A normal ClusterIP is a virtual IP that exists on
      # no interface in the pod, so mongod decides it is not a member of its own
      # replica set, marks itself REMOVED and never elects a primary
      # ("No primary exists currently"). A headless service resolves the same
      # DNS name directly to the pod IP, which fixes the self-check.
      # publishNotReadyAddresses keeps that DNS record present during boot,
      # before the probes mark the pod Ready.
        dump:
          enabled: true
          type: CronJob
          # 01:00, so the dump is finished well before volsync picks it up.
          schedule: "0 1 * * *"
          podSpec:
            restartPolicy: OnFailure
            containers:
              dump:
                enabled: true
                primary: true
                # Same bitnami image as mongod itself: it ships mongodump, and
                # it is already present on the node.
                imageSelector: image
                probes:
                  liveness:
                    enabled: false
                  readiness:
                    enabled: false
                  startup:
                    enabled: false
                env:
                  MONGODB_ROOT_PASSWORD:
                    secretKeyRef:
                      expandObjectName: false
                      name: wekan-makoto-mongodb-credentials
                      key: mongodb-root-password
                command:
                  - /bin/bash
                  - -c
                  - |
                    set -euo pipefail
                    # --archive to a temp name first, then move into place, so a
                    # dump interrupted half-way can never overwrite the last
                    # good archive volsync has yet to copy.
                    mongodump \
                      --host wekan-makoto-mongodb --port 27017 \
                      -u root -p "$MONGODB_ROOT_PASSWORD" \
                      --authenticationDatabase admin \
                      --archive=/dump/wekan.archive.gz.tmp --gzip
                    mv /dump/wekan.archive.gz.tmp /dump/wekan.archive.gz
                    echo "mongodump done: $(date -u +%FT%TZ)"
                    ls -lh /dump

      service:
        main:
          clusterIP: None
          publishNotReadyAddresses: true

      # --- Backups -------------------------------------------------------
      # A volsync snapshot of the live mongodb volume would only ever be
      # crash-consistent. Instead dump the database logically with mongodump
      # (a point-in-time, restorable archive) onto its own small PVC, and let
      # volsync ship THAT to S3. Restore = mongorestore of the archive, which
      # also survives a MongoDB version change.
      # These credentials mirror the parent chart's: subcharts do not inherit
      # the top-level `credentials` block.
      credentials:
        minio:
          type: s3
          url: "${S3_URL}"
          bucket: "taloscluster"
          accessKey: "${S3_ACCESKEY}"
          secretKey: "${S3_SECRETKEY}"
          encrKey: "${S3_ENC}"

      resources:
        requests:
          cpu: 75m
          memory: 512Mi
        limits:
          cpu: 1500m
          memory: 4Gi

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                WRITABLE_PATH: "/data"
                # User Defined
                ROOT_URL: "https://makoto-wekan.${DOMAIN_0}"
                # BROWSER_POLICY_ENABLED: false
                TRUSTED_URL: "https://makoto-wekan.${DOMAIN_0}"
                # LOGOUT_WITH_TIMER: false
                # LOGOUT_IN: 0
                # LOGOUT_ON_HOURS: 0
                # LOGOUT_ON_MINUTES: 0
                # ACCOUNTS_COMMON_LOGIN_EXPIRATION_IN_DAYS: 90
                # ACCOUNTS_LOCKOUT_KNOWN_USERS_FAILURES_BEFORE: 3
                # ACCOUNTS_LOCKOUT_KNOWN_USERS_PERIOD: 60
                # ACCOUNTS_LOCKOUT_KNOWN_USERS_FAILURE_WINDOW: 15
                # ACCOUNTS_LOCKOUT_UNKNOWN_USERS_FAILURES_BERORE: 3
                # ACCOUNTS_LOCKOUT_UNKNOWN_USERS_LOCKOUT_PERIOD: 60
                # ACCOUNTS_LOCKOUT_UNKNOWN_USERS_FAILURE_WINDOW: 15
                # MAX_IMAGE_PIXEL: 1024
                # IMAGE_COMPRESS_RATIO: 80
                # MAIL_URL: ""
                # MAIL_SERVICE_USER: ""
                # MAIL_SERVICE_PASSWORD: ""
                # MAIL_SERVICE: ""
                # MAIL_FROM: ""
                # BIGEVENTS_PATTERN: "NONE"
                # NOTIFICATION_TRAY_AFTER_READ_DAYS_BEFORE_REMOVE: 90
                # EMAIL_NOTIFICATION_TIMEOUT: 30000
                # NOTIFY_DUE_DAYS_BEFORE_AND_AFTER: "2,0"
                # NOTIFY_DUE_AT_HOUR_OF_DAY: 8
                # RESULTS_PER_PAGE: 20
                # RICHER_CARD_COMMENT_EDITOR: false
                # CARD_OPENED_WEBHOOK_ENABLED: false
                # PASSWORD_LOGIN_ENABLED: false
                # WAIT_SPINNER: "Bounce"
                # WITH_API: true
                # WEBHOOKS_ATTRIBUTES: "cardId,listId,oldListId,boardId,comment,user,card,commentId,swimlaneId,customerField,customFieldValue"
                # CORS: "*"
                # CORS_ALLOW_HEADERS: "Authorization,Content-Type"
                # CORS_EXPOSE_HEADERS: "*"
                # MATOMO_ADDRESS: ""
                # MATOMO_SITE_ID: 1
                # MATOMO_DO_NOT_TRACK: true
                # MATOMO_WITH_USERNAME: true
                # ORACLE_OIM_ENABLED: false
                # OAUTH2_ENABLED: false
                # OAUTH2_LOGIN_STYLE: "redirect"
                # OAUTH2_CLIENT_ID: ""
                # OAUTH2_SECRET: ""
                # OAUTH2_SERVER_URL: ""
                # OAUTH2_AUTH_ENDPOINT: ""
                # OAUTH2_USERINFO_ENDPOINT: ""
                # OAUTH2_TOKEN_ENDPOINT: ""
                # OAUTH2_ID_MAP: ""
                # OAUTH2_USERNAME_MAP: ""
                # OAUTH2_FULLNAME_MAP: ""
                # OAUTH2_EMAIL_MAP: ""
                # OAUTH2_ID_TOKEN_WHITELIST_FIELDS: ""
                # OAUTH2_REQUEST_PERMISSIONS: ""
                # OAUTH2_CA_CERT: ""
                # OAUTH2_ADFS_ENABLED: false
                # MUST stay enabled while login goes through LDAP - setting this
                # to "false" locks EVERYONE out, including LDAP users.
                # client/components/main/layouts.js does
                # `if (result === false) return;` and never un-hides
                # `.at-pwd-form`, which CSS hides by default - and the
                # authentication-method dropdown is prepended INTO that same
                # form (connectionMethod.js), as are the username/password
                # fields that LDAP login itself uses. So "no password login"
                # removes the only way to reach the LDAP form.
                # The flag is meant for OAuth2/OIDC-only setups, where the
                # provider button lives outside .at-pwd-form.
                # LDAP-only is instead enforced by: registration disabled, no
                # local accounts existing, and wekan's own guard rejecting
                # password logins for users whose authenticationMethod is ldap.
                PASSWORD_LOGIN_ENABLED: "true"

                # --- LDAP (lldap) integration ---
                LDAP_ENABLE: true
                # Flip to true (both) to debug LDAP logins: without it wekan
                # swallows every LDAP error and fails silently.
                LDAP_LOG_ENABLED: "false"
                DEBUG: "false"
                DEFAULT_AUTHENTICATION_METHOD: "ldap"
                LDAP_HOST: lldap-ldap.lldap.svc.cluster.local
                LDAP_PORT: 3890
                LDAP_BASEDN: ou=people,dc=${DN},dc=${DC}
                LDAP_LOGIN_FALLBACK: false
                LDAP_RECONNECT: true
                # Read-only bind user (same one Authelia uses)
                LDAP_AUTHENTIFICATION: true
                LDAP_AUTHENTIFICATION_USERDN: uid=authuser,ou=people,dc=${DN},dc=${DC}
                LDAP_AUTHENTIFICATION_PASSWORD: ${AUTHELIA_PASSWORD}
                # lldap attribute mapping
                LDAP_USER_SEARCH_FIELD: uid
                LDAP_USER_SEARCH_SCOPE: sub
                # MUST be present, even empty: wekan does
                # `if (User_Search_Filter !== '') { User_Search_Filter[0] ... }`,
                # so an UNSET var is undefined, passes the !== '' test and throws
                # a TypeError that the login handler swallows -> every LDAP login
                # fails with no visible reason.
                LDAP_USER_SEARCH_FILTER: ""
                LDAP_UNIQUE_IDENTIFIER_FIELD: uid
                LDAP_USERNAME_FIELD: uid
                LDAP_FULLNAME_FIELD: cn
                LDAP_EMAIL_FIELD: mail
                LDAP_EMAIL_MATCH_ENABLE: true
                LDAP_EMAIL_MATCH_REQUIRE: false
                LDAP_MERGE_EXISTING_USERS: true
                LDAP_SYNC_USER_DATA: true
                # Same "unset != empty" trap as LDAP_USER_SEARCH_FILTER:
                # getDataToSyncUserData() calls .trim() on the fieldmap BEFORE
                # checking whether sync is on, so an unset var throws on login.
                LDAP_SYNC_USER_DATA_FIELDMAP: ""
                # Unset would make the email fallback read "user@undefined";
                # empty makes wekan fail loudly instead if mail is ever missing.
                LDAP_DEFAULT_DOMAIN: ""
                # Restrict login to the makoto_* groups. Members of
                # LDAP_SYNC_ADMIN_GROUPS are also allowed in and become admins.
                LDAP_GROUP_FILTER_ENABLE: true
                # lldap keeps groups beside the users, not under them, so the
                # group searches need their own base (v10+/v11 only).
                LDAP_GROUP_BASEDN: ou=groups,dc=${DN},dc=${DC}
                LDAP_GROUP_FILTER_OBJECTCLASS: groupOfUniqueNames
                # lldap serves groupOfUniqueNames entries whose member attribute
                # is uniqueMember (not member) - see lldap's own example configs,
                # e.g. nextcloud "ldapGroupMemberAssocAttr uniqueMember".
                LDAP_GROUP_FILTER_GROUP_MEMBER_ATTRIBUTE: uniqueMember
                LDAP_GROUP_FILTER_GROUP_MEMBER_FORMAT: dn
                LDAP_GROUP_FILTER_GROUP_ID_ATTRIBUTE: cn
                # Comma-separated (v10+/v11). makoto_admin is NOT repeated here:
                # wekan adds LDAP_SYNC_ADMIN_GROUPS to the allowed set when
                # admin sync is on, so its members can log in as well.
                LDAP_GROUP_FILTER_GROUP_NAME: "makoto_bestuur,makoto_penningmeester,makoto_trainer"
                LDAP_SYNC_ADMIN_STATUS: true
                LDAP_SYNC_ADMIN_GROUPS: "makoto_admin"
                # HEADER_LOGIN_ID: ""
                # HEADER_LOGIN_FIRSTNAME: ""
                # HEADER_LOGIN_LASTNAME: ""
                # HEADER_LOGIN_EMAIL: ""
                # CAS_ENABLED: false
                # CAS_BASE_URL: ""
                # CAS_LOGIN_URL: ""
                # CAS_VALIDATE_URL: ""
                # SAML_ENABLED: false
                # SAML_PROVIDER: ""
                # SAML_ENTRYPOINT: ""
                # SAML_ISSUER: ""
                # SAML_CERT: ""
                # SAML_IDPSLO_REDIRECTURL: ""
                # SAML_PRIVATE_KEYFILE: ""
                # SAML_PUBLIC_CERTFILE: ""
                # SAML_IDENTIFIER_FORMAT: ""
                # SAML_LOCAL_PROFILE_MATCH_ATTRIBUTE: ""
                # SAML_ATTRIBUTES: ""
                MONGO_URL:
                  secretKeyRef:
                    expandObjectName: false
                    name: '{{ printf "%s-%s" .Release.Name "mongodbcreds" }}'
                    key: url