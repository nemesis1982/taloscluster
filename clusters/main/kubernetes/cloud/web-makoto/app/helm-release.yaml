apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: web-makoto
  namespace: web-makoto
spec:
  interval: 5m
  chart:
    spec:
      chart: wordpress
      version: 13.14.10
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
      interval: 5m
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  timeout: 20m
  values:
    global:
      stopAll: false

    credentials:
      minio:
        type: s3
        url: "${S3_URL}"
        bucket: "taloscluster"
        accessKey: "${S3_ACCESKEY}"
        secretKey: "${S3_SECRETKEY}"
        encrKey: "${S3_ENC}"

    ingress:
      main:
        enabled: true
        ingressClassName: external
        integrations:
          certManager:
            enabled: true
            certificateIssuer: domain-0-le-prod
        hosts:
          - host: makoto-web.${DOMAIN_0}
            paths:
              - path: /
                pathType: Prefix

    persistence:
      config:
        volsync:
        - name: config
          type: restic
          credentials: minio
          dest:
            enabled: true
          src:
            enabled: true
            trigger:
              schedule: 10 1 * * *

    wordpress:
      user: makoto-info
      pass: "hPv2qRHxd.aPdWpJQ_6tWi6-MHCjE8!kd"
      email: "info@makoto-dokokaj.nl"
      first_name: Makoto
      last_name: Dokokaj
      blog_name: Makoto Dokokaj
      enable_reverse_proxy_headers: true

    smtp:
      enabled: true
      host: "mail.makoto-dokokaj.nl"
      port: 465
      user: "info@makoto-dokokaj.nl"
      pass: "&%M@k0tO<2023>!#"
      
    mariadb:
      enabled: true
      mariadbUsername: "wp_mak_secure"
      mariadbDatabase: "AXK3sNDJP4mJDeXExBrGCAcAwB*q-Xhgn